name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gitleaks step below scans the whole history; the default
          # shallow fetch would hand it a single commit to look at.
          fetch-depth: 0

      - name: Install lint/test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh bats
          # stylua via cargo release; skip if unavailable quickly, the lua
          # check is best-effort locally too.
          command -v stylua >/dev/null 2>&1 || true

      - name: make lint
        run: make lint

      - name: make test
        run: make test

      - name: Install gitleaks
        run: |
          # gitleaks isn't packaged on Debian/Ubuntu (see issue #115), so
          # fetch the release binary like install.sh does for lazygit.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks scan (full history)
        # Catches a --no-verify commit or a machine without the local hook;
        # the pre-commit hook only checks the staged diff.
        # gitleaks already exits 1 on findings; --exit-code takes an int, so
        # passing it bare is a CLI error rather than a stricter scan.
        run: gitleaks git --no-banner
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
